name: Android

on:
  push:
    branches:
      - codex/android-only
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build Android web assets
        run: VITE_DISABLE_QUESTION_BANK_EXPORT=1 npm run build

      - name: Run release quality gates
        run: npm run check:quality

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: tarim-examdeck-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  instrumented:
    name: Run Android emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies and build assets
        run: |
          npm ci
          VITE_DISABLE_QUESTION_BANK_EXPORT=1 npm run build
          npx cap sync android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify package and offline assets on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest

  release:
    name: Publish signed Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - instrumented
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node scripts/android-release-info.mjs versionName)"

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TARIM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystores/tarim-android-release.jks

      - name: Build and verify signed APK
        env:
          TARIM_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystores/tarim-android-release.jks
          TARIM_ANDROID_KEY_ALIAS: ${{ secrets.TARIM_ANDROID_KEY_ALIAS }}
          TARIM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TARIM_ANDROID_KEYSTORE_PASSWORD }}
          TARIM_ANDROID_KEY_PASSWORD: ${{ secrets.TARIM_ANDROID_KEY_PASSWORD }}
        run: npm run android:pack

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/tarim-examdeck-android-v*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
