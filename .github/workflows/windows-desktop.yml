name: Build Windows Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows-app.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: tarim-examdeck-windows-setup-v${{ steps.version.outputs.app_version }}
          path: release/tarim-examdeck-windows-setup-v${{ steps.version.outputs.app_version }}.exe
          if-no-files-found: error
